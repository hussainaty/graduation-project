name: Collect EGX prices and refresh M1

"on":
  schedule:
    - cron: "0 15 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-collect-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install TTM (CPU torch + IBM granite-tsfm, pinned commit)
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "granite-tsfm @ git+https://github.com/ibm-granite/granite-tsfm.git@ca04f02"
      - name: Collect prices
        run: python collect_egx.py
      - name: Audit and clean prices
        run: python clean_prices.py
      - name: Refresh forecasts
        run: python m1_har.py
      - name: Commit updated prices and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- prices/ results/ cleaned/
          if compgen -G 'actions/*.csv' > /dev/null; then
            git add -- actions/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Refresh EGX prices and M1 results"
            git push origin HEAD
          fi
